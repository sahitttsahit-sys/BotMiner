name: debug-ssh
on:
  workflow_dispatch:
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rate limit test vps40
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/miner_key && chmod 600 ~/.ssh/miner_key
          for i in $(seq 1 45); do
            if ssh -i ~/.ssh/miner_key \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ProxyCommand='node ssh-ws-bridge40.js --stdio' \
              -o ConnectTimeout=15 -o NumberOfPasswordPrompts=0 root@bridge40 'echo OK' 2>/dev/null; then
              echo "try $i OK"
            else
              echo "try $i FAIL"
            fi
          done
