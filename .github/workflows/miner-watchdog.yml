name: miner-watchdog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure miner running (vps-ws)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/miner_key && chmod 600 ~/.ssh/miner_key
          ssh -i ~/.ssh/miner_key \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand='node ssh-ws-bridge.js --stdio' \
            -o ConnectTimeout=25 root@bridge /root/start-miner.sh

      - name: Ensure miner running (vps2)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          ssh -i ~/.ssh/miner_key \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand='node ssh-ws-bridge2.js --stdio' \
            -o ConnectTimeout=25 root@bridge2 /root/start-miner.sh

      - name: Ensure miner running (vps3)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          ssh -i ~/.ssh/miner_key \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand='node ssh-ws-bridge3.js --stdio' \
            -o ConnectTimeout=25 root@bridge3 /root/start-miner.sh

      - name: Ensure miner running (vps4)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          ssh -i ~/.ssh/miner_key \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand='node ssh-ws-bridge4.js --stdio' \
            -o ConnectTimeout=25 root@bridge4 /root/start-miner.sh
