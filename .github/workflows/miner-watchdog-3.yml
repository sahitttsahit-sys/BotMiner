name: miner-watchdog-3

concurrency:
  group: miner-watchdog-3
  cancel-in-progress: true

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # VPS baru (vps81+) ditambahkan di sini sebagai step "Ensure miner running (vpsN)".
      # Step pertama WAJIB diawali init key:
      #   mkdir -p ~/.ssh && chmod 700 ~/.ssh
      #   printf '%s\n' "$SSH_KEY" > ~/.ssh/miner_key && chmod 600 ~/.ssh/miner_key

      - name: Ensure miner running (vps81)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/miner_key && chmod 600 ~/.ssh/miner_key
          ssh -i ~/.ssh/miner_key \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand='node ssh-ws-bridge81.js --stdio' \
            -o ConnectTimeout=25 root@bridge81 /root/start-miner.sh || echo "WARN: bridge81 gagal, lanjut"

      - name: Ensure miner running (vps82)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          ssh -i ~/.ssh/miner_key \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand='node ssh-ws-bridge82.js --stdio' \
            -o ConnectTimeout=25 root@bridge82 /root/start-miner.sh || echo "WARN: bridge82 gagal, lanjut"
